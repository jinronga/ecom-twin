[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-twin"
version = "0.1.0"
description = "跨境电商运营数字分身"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
evidence = ["Pillow>=10,<13"]

[project.scripts]
ecom-twin = "ecom_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecom_twin = ["prompts/*.md", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
