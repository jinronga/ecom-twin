<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-label="工作原理图：飞书或定时任务进入任务入口，交给 Agent；Agent 通过 MCP 查询或修改暂存区，写店铺必须提交提案并经人工审批后由执行器执行；结果核验后回复飞书，并写入 SQLite 和业务记忆" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8781"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4532a"/></marker><marker id="ns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8781"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4532a"/></marker></defs><rect width="1200" height="830" fill="#ffffff"/><rect x="450" y="24" width="300" height="56" rx="9" fill="#eef6ff" stroke="#4f7fb8" stroke-width="2"/><text x="600.0" y="50.0" font-size="14" font-weight="700" fill="#18324b" text-anchor="middle">飞书消息 / 定时任务</text><text x="600.0" y="69.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">私聊 · 群消息 · 日报 · 雷达</text><rect x="350" y="112" width="500" height="58" rx="9" fill="#eef6ff" stroke="#4f7fb8" stroke-width="2"/><text x="600.0" y="139.0" font-size="14" font-weight="700" fill="#18324b" text-anchor="middle">任务入口</text><text x="600.0" y="158.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">过滤 · 合并 · 引用关系 · 自动聊天上下文</text><rect x="400" y="202" width="400" height="58" rx="9" fill="#fff4dc" stroke="#b47a18" stroke-width="2"/><text x="600.0" y="229.0" font-size="14" font-weight="700" fill="#4d3408" text-anchor="middle">Agent Runtime</text><text x="600.0" y="248.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">Codex · Claude Code · Cursor · OpenCode</text><rect x="450" y="292" width="300" height="54" rx="9" fill="#fff4dc" stroke="#b47a18" stroke-width="2"/><text x="600.0" y="317.0" font-size="14" font-weight="700" fill="#4d3408" text-anchor="middle">判断本轮要做什么</text><text x="600.0" y="336.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">由任务和工具边界决定</text><rect x="40" y="400" width="340" height="64" rx="9" fill="#eef8ee" stroke="#4d8a55" stroke-width="2"/><text x="210.0" y="430.0" font-size="14" font-weight="700" fill="#173d1e" text-anchor="middle">MCP 只读工具</text><text x="210.0" y="449.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">查询 · 分析 · 证据 · 店铺 · ERP · 记忆 · SOP</text><rect x="430" y="400" width="340" height="64" rx="9" fill="#eef8ee" stroke="#4d8a55" stroke-width="2"/><text x="600.0" y="430.0" font-size="14" font-weight="700" fill="#173d1e" text-anchor="middle">MCP 写入工具</text><text x="600.0" y="449.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">起草 · 暂存区修改 · 合规检查 · 留痕</text><rect x="820" y="400" width="340" height="58" rx="9" fill="#fceceb" stroke="#b45852" stroke-width="2"/><text x="990.0" y="427.0" font-size="14" font-weight="700" fill="#4e1b18" text-anchor="middle">MCP 提交提案</text><text x="990.0" y="446.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">发布 · 提交 · 删除等对外动作</text><rect x="820" y="490" width="340" height="58" rx="9" fill="#fceceb" stroke="#b45852" stroke-width="2"/><text x="990.0" y="517.0" font-size="14" font-weight="700" fill="#4e1b18" text-anchor="middle">人工审批</text><text x="990.0" y="536.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">限额 · 有效期 · 风险 · 双人审批</text><rect x="820" y="580" width="340" height="58" rx="9" fill="#fceceb" stroke="#b45852" stroke-width="2"/><text x="990.0" y="607.0" font-size="14" font-weight="700" fill="#4e1b18" text-anchor="middle">执行器</text><text x="990.0" y="626.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">复核数据与硬上限后执行</text><rect x="390" y="660" width="420" height="62" rx="9" fill="#f3effc" stroke="#7758a8" stroke-width="2"/><text x="600.0" y="689.0" font-size="14" font-weight="700" fill="#2e1d47" text-anchor="middle">结果核验</text><text x="600.0" y="708.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">成功 / 失败 / 证据 / 待人工确认</text><rect x="40" y="748" width="340" height="60" rx="9" fill="#f3effc" stroke="#7758a8" stroke-width="2"/><text x="210.0" y="776.0" font-size="14" font-weight="700" fill="#2e1d47" text-anchor="middle">飞书交付</text><text x="210.0" y="795.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">话题回复 · 图片 · 审批卡片</text><rect x="430" y="748" width="340" height="60" rx="9" fill="#f3effc" stroke="#7758a8" stroke-width="2"/><text x="600.0" y="776.0" font-size="14" font-weight="700" fill="#2e1d47" text-anchor="middle">SQLite 留痕</text><text x="600.0" y="795.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">任务 · 步骤 · 审计 · 成本</text><rect x="820" y="748" width="340" height="60" rx="9" fill="#f3effc" stroke="#7758a8" stroke-width="2"/><text x="990.0" y="776.0" font-size="14" font-weight="700" fill="#2e1d47" text-anchor="middle">Markdown 记忆</text><text x="990.0" y="795.0" font-size="11" font-weight="400" fill="#5f6a64" text-anchor="middle">SOP · 业务经验 · 选品剧本</text><path d="M600,80 L600,112" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><path d="M600,170 L600,202" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><path d="M600,260 L600,292" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><path d="M600,346 L600,372 L210,372 L210,400" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><rect x="356.7" y="353" width="70.6" height="15" fill="#ffffff" opacity="0.92"/><text x="392" y="364" font-size="11" font-weight="500" fill="#5f6a64" text-anchor="middle">查询 / 证据</text><path d="M600,346 L600,400" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><rect x="604.0" y="369" width="70.6" height="15" fill="#ffffff" opacity="0.92"/><text x="608" y="380" font-size="11" font-weight="500" fill="#5f6a64" text-anchor="start">草稿 / 暂存</text><path d="M600,346 L600,372 L990,372 L990,400" fill="none" stroke="#b4532a" stroke-width="1.6" marker-end="url(#a)"/><rect x="779.0" y="353" width="52.0" height="15" fill="#ffffff" opacity="0.92"/><text x="805" y="364" font-size="11" font-weight="500" fill="#b4532a" text-anchor="middle">对外执行</text><path d="M990,458 L990,490" fill="none" stroke="#b4532a" stroke-width="1.6" marker-end="url(#a)"/><path d="M990,548 L990,580" fill="none" stroke="#b4532a" stroke-width="1.6" marker-end="url(#a)"/><rect x="994.0" y="555" width="30.0" height="15" fill="#ffffff" opacity="0.92"/><text x="998" y="566" font-size="11" font-weight="500" fill="#b4532a" text-anchor="start">批准</text><path d="M1160,519 L1184,519 L1184,319 L750,319" fill="none" stroke="#b4532a" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="989.6" y="300" width="140.8" height="15" fill="#ffffff" opacity="0.92"/><text x="1060" y="311" font-size="11" font-weight="500" fill="#b4532a" text-anchor="middle">修改 / 拒绝后回到 Agent</text><path d="M210,464 L210,691 L390,691" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><path d="M600,464 L600,660" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><path d="M990,638 L990,691 L810,691" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><rect x="862.0" y="672" width="52.0" height="15" fill="#ffffff" opacity="0.92"/><text x="888" y="683" font-size="11" font-weight="500" fill="#5f6a64" text-anchor="middle">执行结果</text><path d="M600,722 L600,748" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><path d="M600,722 L210,722 L210,748" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><path d="M600,722 L990,722 L990,748" fill="none" stroke="#7d8781" stroke-width="1.3" marker-end="url(#n)"/><text x="30" y="812" font-size="11" font-weight="500" fill="#5f6a64" text-anchor="start">边界：Agent 可以直接查询和修改暂存区；真正写店铺或执行不可撤回动作，必须经过提案、人工审批和执行器复核。</text></svg>
